apiVersion: apps/v1
kind: Deployment
metadata:
  name: africa-healthcare-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: africa-healthcare-backend
  template:
    metadata:
      labels:
        app: africa-healthcare-backend
    spec:
      containers:
        - name: backend
          image: africa-healthcare/backend:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: africa-healthcare-backend
spec:
  selector:
    app: africa-healthcare-backend
  ports:
    - port: 8000
      targetPort: 8000
