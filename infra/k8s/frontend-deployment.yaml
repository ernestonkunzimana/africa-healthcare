apiVersion: apps/v1
kind: Deployment
metadata:
  name: africa-healthcare-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: africa-healthcare-frontend
  template:
    metadata:
      labels:
        app: africa-healthcare-frontend
    spec:
      containers:
        - name: frontend
          image: africa-healthcare/frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: africa-healthcare-frontend
spec:
  selector:
    app: africa-healthcare-frontend
  ports:
    - port: 80
      targetPort: 80
